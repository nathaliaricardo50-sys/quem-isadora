<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Quem é a Isadora?</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Permanent+Marker&family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
* { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --vermelho: #e10600;
  --vermelho-escuro: #8a0000;
  --texto: #fff;
  --vidro: rgba(8, 0, 0, 0.62);
}

body {
  font-family: "Poppins", sans-serif;
  color: var(--texto);
  background: #0a0000;
  min-height: 100vh;
  min-height: 100dvh;
  overflow-x: hidden;
}

/* ===== Fundo borrado ===== */
.bg {
  position: fixed;
  inset: 0;
  background: #0a0000 center top / cover no-repeat;
  filter: blur(16px) brightness(0.55);
  transform: scale(1.15);
  z-index: -2;
}
.overlay {
  position: fixed;
  inset: 0;
  background: radial-gradient(circle at 50% 100%, rgba(225, 6, 0, 0.35), rgba(0, 0, 0, 0.6) 70%);
  z-index: -1;
}

#app {
  max-width: 460px;
  margin: 0 auto;
  padding: 28px 16px 40px;
}

.tela { display: none; animation: entrar 0.3s ease; }
.tela.ativa { display: block; }
@keyframes entrar { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

/* ===== Título ===== */
.titulo {
  font-family: "Permanent Marker", cursive;
  font-size: 2.6rem;
  line-height: 1.05;
  text-align: center;
  text-shadow: 0 3px 0 #000, 0 0 18px rgba(0, 0, 0, 0.8);
  margin-bottom: 12px;
}
.titulo span {
  display: block;
  color: var(--vermelho);
  font-size: 3.4rem;
  text-shadow: 0 3px 0 #000, 0 0 22px rgba(225, 6, 0, 0.7);
}
.titulo.pequeno { font-size: 1.6rem; margin-bottom: 18px; }
.titulo.pequeno span { display: inline; font-size: 1.9rem; }

.subtitulo {
  text-align: center;
  margin-bottom: 26px;
  opacity: 0.9;
}

/* ===== Caixas e botões ===== */
.caixa {
  background: var(--vidro);
  backdrop-filter: blur(6px);
  border: 1px solid rgba(225, 6, 0, 0.5);
  border-radius: 18px;
  padding: 22px 18px;
  box-shadow: 0 0 24px rgba(225, 6, 0, 0.18);
  margin-bottom: 14px;
}
.caixa h2 { text-align: center; margin-bottom: 14px; font-size: 1.2rem; }

label { display: block; font-size: 0.85rem; margin: 10px 0 6px; opacity: 0.9; }

input {
  width: 100%;
  padding: 13px 14px;
  border-radius: 12px;
  border: 2px solid #3a0000;
  background: rgba(0, 0, 0, 0.55);
  color: #fff;
  font: inherit;
  font-size: 1.05rem;
  outline: none;
}
input:focus { border-color: var(--vermelho); }
.codigo-input { text-align: center; letter-spacing: 12px; font-size: 1.7rem; font-weight: 700; }

.btn {
  display: block;
  width: 100%;
  margin-top: 14px;
  padding: 14px;
  border: 0;
  border-radius: 14px;
  background: linear-gradient(180deg, #ff2a1f, var(--vermelho-escuro));
  color: #fff;
  font: inherit;
  font-weight: 700;
  font-size: 1.05rem;
  cursor: pointer;
  box-shadow: 0 4px 0 #4d0000;
  transition: transform 0.08s;
}
.btn:active { transform: translateY(3px); box-shadow: 0 1px 0 #4d0000; }
.btn:disabled { opacity: 0.45; cursor: not-allowed; }
.btn.secundario { background: rgba(255, 255, 255, 0.1); border: 2px solid var(--vermelho); box-shadow: none; }
.btn.link { background: none; box-shadow: none; font-weight: 400; opacity: 0.8; margin-top: 8px; padding: 8px; font-size: 0.95rem; }

/* ===== Lobby ===== */
.codigo-sala {
  text-align: center;
  font-family: "Permanent Marker", cursive;
  font-size: 3.4rem;
  letter-spacing: 8px;
  color: var(--vermelho);
  text-shadow: 0 2px 0 #000;
}
.dica-texto { text-align: center; font-size: 0.85rem; opacity: 0.8; margin-top: 6px; }

.lista { list-style: none; margin-top: 8px; }
.lista li {
  padding: 11px 14px;
  margin-top: 8px;
  border-radius: 12px;
  background: rgba(255, 255, 255, 0.08);
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.lista li.atual { background: var(--vermelho); font-weight: 700; transform: scale(1.03); }
.lista li.feito { opacity: 0.45; text-decoration: line-through; }
.selo { font-size: 0.7rem; background: var(--vermelho); padding: 2px 8px; border-radius: 99px; }
.lista li.atual .selo { background: #000; }

.espera { text-align: center; opacity: 0.8; margin-top: 14px; font-size: 0.95rem; }

/* ===== Carta do papel ===== */
.carta {
  position: relative;
  min-height: 330px;
  border-radius: 20px;
  overflow: hidden;
  border: 2px solid var(--vermelho);
  background: #120000;
  cursor: pointer;
  box-shadow: 0 0 28px rgba(225, 6, 0, 0.35);
}
.carta .frente, .carta .verso {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 18px;
}
.carta .verso { display: none; }
.carta.revelada .frente { display: none; }
.carta.revelada .verso { display: flex; }
.carta .frente .interrogacao { font-family: "Permanent Marker", cursive; font-size: 6rem; color: var(--vermelho); line-height: 1; }
.carta .frente p { margin-top: 8px; font-weight: 600; }

.carta .verso.isadora { background: #000; padding: 0; justify-content: flex-end; }
.carta .verso.isadora img {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  object-position: center top;
}
.carta .verso.isadora .faixa {
  position: relative;
  width: 100%;
  padding: 60px 14px 16px;
  background: linear-gradient(180deg, transparent, rgba(0, 0, 0, 0.92) 55%);
}

.papel-titulo { font-family: "Permanent Marker", cursive; font-size: 2.1rem; line-height: 1.1; }
.papel-titulo.vermelho { color: var(--vermelho); text-shadow: 0 2px 0 #000; }
.nome-grande { font-family: "Permanent Marker", cursive; font-size: 2.6rem; word-break: break-word; }
.info-dica { margin-top: 12px; font-size: 1.05rem; }
.info-dica strong { color: #ff6b63; font-size: 1.6rem; display: block; margin-top: 2px; text-transform: uppercase; }
.toque-esconder { font-size: 0.75rem; opacity: 0.6; margin-top: 12px; }

/* ===== Rodada ===== */
.vez-grande { text-align: center; }
.vez-grande small { opacity: 0.8; }
.vez-grande .nome { font-family: "Permanent Marker", cursive; font-size: 2.6rem; color: var(--vermelho); text-shadow: 0 2px 0 #000; word-break: break-word; }

.mini-papel {
  margin-top: 12px;
  padding: 12px;
  border-radius: 14px;
  border: 1px dashed rgba(255, 255, 255, 0.4);
  text-align: center;
  cursor: pointer;
  font-size: 0.95rem;
  background: rgba(0, 0, 0, 0.35);
}

/* ===== Votação ===== */
.voto-btn {
  display: flex;
  justify-content: space-between;
  align-items: center;
  width: 100%;
  margin-top: 10px;
  padding: 14px 16px;
  border-radius: 14px;
  border: 2px solid var(--vermelho);
  background: rgba(255, 255, 255, 0.07);
  color: #fff;
  font: inherit;
  font-weight: 600;
  font-size: 1.05rem;
  cursor: pointer;
}
.voto-btn:active { background: var(--vermelho); }

/* ===== Resultado ===== */
.resultado-titulo { text-align: center; font-family: "Permanent Marker", cursive; font-size: 2.2rem; line-height: 1.1; }
.resultado-titulo.ganhou { color: #5dff8a; }
.resultado-titulo.perdeu { color: var(--vermelho); }
.foto-reveal { display: block; width: 150px; height: 150px; object-fit: cover; object-position: center top; border-radius: 50%; border: 3px solid var(--vermelho); margin: 14px auto 8px; }
.linha { display: flex; justify-content: space-between; padding: 8px 4px; border-bottom: 1px solid rgba(255, 255, 255, 0.12); }
.linha:last-child { border-bottom: 0; }

/* ===== Aviso ===== */
#aviso {
  position: fixed;
  left: 50%;
  bottom: 24px;
  transform: translate(-50%, 30px);
  background: #000;
  border: 1px solid var(--vermelho);
  padding: 12px 18px;
  border-radius: 99px;
  font-size: 0.9rem;
  opacity: 0;
  pointer-events: none;
  transition: 0.25s;
  max-width: 92vw;
  text-align: center;
}
#aviso.visivel { opacity: 1; transform: translate(-50%, 0); }

</style>
</head>
<body>
  <!-- Fundo: a foto da Isadora borrada -->
  <div class="bg"></div>
  <div class="overlay"></div>

  <main id="app">

    <!-- TELA INICIAL -->
    <section id="tela-inicio" class="tela ativa">
      <h1 class="titulo">Quem é a <span>Isadora?</span></h1>
      <p class="subtitulo">Uma de vocês é a Isadora. Descubram quem antes que seja tarde.</p>
      <div class="caixa">
        <button class="btn" data-acao="ir-criar">Criar sala</button>
        <button class="btn secundario" data-acao="ir-entrar">Entrar com código</button>
      </div>
    </section>

    <!-- CRIAR SALA -->
    <section id="tela-criar" class="tela">
      <h1 class="titulo pequeno">Quem é a <span>Isadora?</span></h1>
      <div class="caixa">
        <h2>Criar sala</h2>
        <label for="nome-criar">Seu nome</label>
        <input id="nome-criar" type="text" maxlength="14" placeholder="Ex: Nathália" autocomplete="off">
        <button class="btn" data-acao="criar">Criar sala</button>
        <button class="btn link" data-acao="voltar-inicio">Voltar</button>
      </div>
    </section>

    <!-- ENTRAR NA SALA -->
    <section id="tela-entrar" class="tela">
      <h1 class="titulo pequeno">Quem é a <span>Isadora?</span></h1>
      <div class="caixa">
        <h2>Entrar na sala</h2>
        <label for="codigo-entrar">Código da sala (4 números)</label>
        <input id="codigo-entrar" type="text" inputmode="numeric" maxlength="4" placeholder="0000" class="codigo-input" autocomplete="off">
        <label for="nome-entrar">Seu nome</label>
        <input id="nome-entrar" type="text" maxlength="14" placeholder="Ex: Gabriele" autocomplete="off">
        <button id="btn-entrar" class="btn" data-acao="entrar">Entrar na sala</button>
        <button class="btn link" data-acao="voltar-inicio">Voltar</button>
      </div>
    </section>

    <!-- JOGO (lobby, papel, rodada, votação, resultado) -->
    <section id="tela-jogo" class="tela">
      <h1 class="titulo pequeno">Quem é a <span>Isadora?</span></h1>
      <div id="conteudo-jogo"></div>
    </section>

  </main>

  <div id="aviso" role="status"></div>

// Converte o texto acima em uma lista de objetos { palavra, dica }
const PALAVRAS = TEXTO_PALAVRAS
  .split(/[\n|]/)
  .map((s) => s.trim())
  .filter(Boolean)
  .map((s) => {
    const [palavra, dica] = s.split(":");
    return { palavra: palavra.trim(), dica: dica.trim() };
  });

"use strict";

/* =====================================================
   QUEM É A ISADORA?
   Online sem servidor próprio: usa PeerJS (conexão direta
   entre os celulares). Quem cria a sala é o "anfitrião" e
   guarda o segredo (quem é a Isadora e a palavra).
   ===================================================== */

const PREFIXO = "quemeisadora-";
const MIN_JOGADORES = 3;

let peer = null;
let ehHost = false;
let meuId = null;
let meuNome = "";
let hostConn = null;
const conexoes = {}; // só o anfitrião usa: id -> conexão

let estado = novoEstado("");
let meuPapel = null; // { papel: "isadora", dica } ou { papel: "inocente", palavra }
let papelRevelado = false;
let segredo = null; // só o anfitrião: { isadoraId, palavra, dica }
let votos = {}; // só o anfitrião: votanteId -> alvoId

function novoEstado(codigo) {
  return { fase: "lobby", codigo, jogadores: [], ordem: [], vez: 0, rodada: 1, votaram: [], resultado: null };
}

/* ---------- utilidades ---------- */
const $ = (s) => document.querySelector(s);

function esc(t) {
  return String(t).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

function mostrarTela(id) {
  document.querySelectorAll(".tela").forEach((t) => t.classList.toggle("ativa", t.id === id));
}

function aviso(msg) {
  const el = $("#aviso");
  el.textContent = msg;
  el.classList.add("visivel");
  clearTimeout(aviso.t);
  aviso.t = setTimeout(() => el.classList.remove("visivel"), 3500);
}

function embaralhar(lista) {
  const a = [...lista];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function nomeDe(id) {
  const j = estado.jogadores.find((x) => x.id === id);
  return j ? j.nome : "?";
}

/* Sorteia uma palavra sem repetir até acabar todas (guarda no navegador do anfitrião) */
function sortearPalavra() {
  let baralho;
  try { baralho = JSON.parse(localStorage.getItem("isadora-baralho") || "[]"); } catch { baralho = []; }
  baralho = baralho.filter((i) => i < PALAVRAS.length);
  if (!baralho.length) baralho = embaralhar(PALAVRAS.map((_, i) => i));
  const i = baralho.pop();
  try { localStorage.setItem("isadora-baralho", JSON.stringify(baralho)); } catch { /* ignora */ }
  return PALAVRAS[i];
}

/* ---------- envio de mensagens ---------- */
function enviarPara(conn, msg) {
  if (conn && conn.open) conn.send(msg);
}

function broadcast() {
  Object.values(conexoes).forEach((c) => enviarPara(c, { t: "estado", estado }));
  renderizar();
}

function broadcastMsg(msg) {
  Object.values(conexoes).forEach((c) => enviarPara(c, msg));
}

/* ---------- criar sala (anfitrião) ---------- */
function criarSala() {
  const nome = $("#nome-criar").value.trim();
  if (!nome) return aviso("Digite seu nome.");
  abrirSala(nome, 0);
}

function abrirSala(nome, tentativas) {
  const codigo = String(Math.floor(1000 + Math.random() * 9000));
  const p = new Peer(PREFIXO + codigo);
  let aberto = false;

  p.on("open", () => {
    aberto = true;
    peer = p;
    ehHost = true;
    meuId = "host";
    meuNome = nome;
    estado = novoEstado(codigo);
    estado.jogadores = [{ id: "host", nome }];
    p.on("connection", configurarConexao);
    renderizar();
    mostrarTela("tela-jogo");
  });

  p.on("disconnected", () => { if (aberto) p.reconnect(); });

  p.on("error", (e) => {
    if (!aberto && e.type === "unavailable-id" && tentativas < 8) {
      p.destroy();
      abrirSala(nome, tentativas + 1);
    } else if (!aberto) {
      aviso("Não consegui criar a sala. Verifique a internet.");
    }
  });
}

function configurarConexao(conn) {
  conn.on("data", (d) => hostRecebe(conn, d));
  conn.on("close", () => hostSaiu(conn.peer));
  conn.on("error", () => hostSaiu(conn.peer));
}

function hostRecebe(conn, d) {
  if (!d || !d.t) return;

  if (d.t === "join") {
    const nome = String(d.nome || "").trim().slice(0, 14);
    if (estado.fase !== "lobby") {
      enviarPara(conn, { t: "erro", msg: "O jogo dessa sala já começou." });
      return setTimeout(() => conn.close(), 300);
    }
    if (!nome) {
      enviarPara(conn, { t: "erro", msg: "Digite um nome." });
      return setTimeout(() => conn.close(), 300);
    }
    if (estado.jogadores.some((j) => j.nome.toLowerCase() === nome.toLowerCase())) {
      enviarPara(conn, { t: "erro", msg: "Já tem alguém com esse nome na sala." });
      return setTimeout(() => conn.close(), 300);
    }
    if (estado.jogadores.length >= 12) {
      enviarPara(conn, { t: "erro", msg: "A sala está cheia (12 jogadores)." });
      return setTimeout(() => conn.close(), 300);
    }
    conexoes[conn.peer] = conn;
    estado.jogadores.push({ id: conn.peer, nome });
    enviarPara(conn, { t: "bemvindo", id: conn.peer });
    broadcast();
  }

  if (d.t === "voto") registrarVoto(conn.peer, d.alvo);
}

function hostSaiu(id) {
  if (!ehHost) return;
  const j = estado.jogadores.find((x) => x.id === id);
  if (!j) return;
  delete conexoes[id];
  estado.jogadores = estado.jogadores.filter((x) => x.id !== id);
  if (estado.fase === "lobby") return broadcast();
  voltarLobby(j.nome + " saiu da sala. Partida cancelada.");
}

/* ---------- entrar na sala ---------- */
function resetarBotaoEntrar() {
  const btn = $("#btn-entrar");
  btn.disabled = false;
  btn.textContent = "Entrar na sala";
}

function entrarSala() {
  const nome = $("#nome-entrar").value.trim();
  const codigo = $("#codigo-entrar").value.trim();
  if (!nome) return aviso("Digite seu nome.");
  if (!/^\d{4}$/.test(codigo)) return aviso("O código tem 4 números.");

  const btn = $("#btn-entrar");
  btn.disabled = true;
  btn.textContent = "Entrando...";

  const p = new Peer();
  let entrou = false;
  const limite = setTimeout(() => {
    if (entrou) return;
    aviso("Sala não encontrada.");
    p.destroy();
    resetarBotaoEntrar();
  }, 10000);

  p.on("open", () => {
    const conn = p.connect(PREFIXO + codigo, { reliable: true });
    conn.on("open", () => {
      entrou = true;
      clearTimeout(limite);
      peer = p;
      hostConn = conn;
      ehHost = false;
      meuNome = nome;
      conn.send({ t: "join", nome });
    });
    conn.on("data", clienteRecebe);
    conn.on("close", () => {
      if (hostConn === conn) sairParaInicio("A sala foi encerrada.");
    });
  });

  p.on("error", (e) => {
    if (entrou) return;
    clearTimeout(limite);
    aviso(e.type === "peer-unavailable" ? "Sala não encontrada." : "Erro de conexão. Tente de novo.");
    p.destroy();
    resetarBotaoEntrar();
  });
}

function clienteRecebe(d) {
  if (!d || !d.t) return;
  if (d.t === "bemvindo") {
    meuId = d.id;
    resetarBotaoEntrar();
    mostrarTela("tela-jogo");
  } else if (d.t === "estado") {
    if (d.estado.fase === "papel" && estado.fase !== "papel") papelRevelado = false;
    estado = d.estado;
    renderizar();
  } else if (d.t === "papel") {
    meuPapel = d.dados;
    papelRevelado = false;
  } else if (d.t === "aviso") {
    aviso(d.msg);
  } else if (d.t === "erro") {
    aviso(d.msg);
    const conn = hostConn;
    hostConn = null;
    if (conn) conn.close();
    if (peer) peer.destroy();
    peer = null;
    resetarBotaoEntrar();
    mostrarTela("tela-entrar");
  }
}

function sairParaInicio(msg) {
  if (peer) peer.destroy();
  peer = null;
  hostConn = null;
  ehHost = false;
  meuId = null;
  meuPapel = null;
  segredo = null;
  votos = {};
  Object.keys(conexoes).forEach((k) => delete conexoes[k]);
  estado = novoEstado("");
  resetarBotaoEntrar();
  mostrarTela("tela-inicio");
  if (msg) aviso(msg);
}

/* ---------- ações do anfitrião ---------- */
function iniciar() {
  if (!ehHost) return;
  if (estado.jogadores.length < MIN_JOGADORES) return aviso("Precisa de pelo menos " + MIN_JOGADORES + " jogadores.");

  const sorteio = sortearPalavra();
  const ids = estado.jogadores.map((j) => j.id);
  const isadoraId = ids[Math.floor(Math.random() * ids.length)];

  // Quem começa é sorteado; depois segue a ordem da lista
  const inicio = Math.floor(Math.random() * ids.length);
  estado.ordem = [...ids.slice(inicio), ...ids.slice(0, inicio)];
  estado.vez = 0;
  estado.rodada = 1;
  estado.votaram = [];
  estado.resultado = null;
  estado.fase = "papel";

  segredo = { isadoraId, palavra: sorteio.palavra, dica: sorteio.dica };
  votos = {};
  papelRevelado = false;

  estado.jogadores.forEach((j) => {
    const dados = j.id === isadoraId
      ? { papel: "isadora", dica: sorteio.dica }
      : { papel: "inocente", palavra: sorteio.palavra };
    if (j.id === "host") meuPapel = dados;
    else enviarPara(conexoes[j.id], { t: "papel", dados });
  });

  broadcast();
}

function comecarRodada() {
  if (!ehHost) return;
  estado.fase = "rodada";
  estado.vez = 0;
  broadcast();
}

function proximo() {
  if (!ehHost) return;
  if (estado.vez < estado.ordem.length) estado.vez++;
  broadcast();
}

function maisRodada() {
  if (!ehHost) return;
  estado.vez = 0;
  estado.rodada++;
  broadcast();
}

function irVotacao() {
  if (!ehHost) return;
  votos = {};
  estado.votaram = [];
  estado.fase = "votacao";
  broadcast();
}

function votar(alvo) {
  if (ehHost) registrarVoto("host", alvo);
  else enviarPara(hostConn, { t: "voto", alvo });
}

function registrarVoto(votante, alvo) {
  if (estado.fase !== "votacao") return;
  if (votante === alvo) return;
  if (votos[votante]) return;
  if (!estado.jogadores.some((j) => j.id === votante) || !estado.jogadores.some((j) => j.id === alvo)) return;

  votos[votante] = alvo;
  estado.votaram = Object.keys(votos);
  if (estado.votaram.length === estado.jogadores.length) finalizar();
  else broadcast();
}

function finalizar() {
  const contagem = {};
  estado.jogadores.forEach((j) => (contagem[j.id] = 0));
  Object.values(votos).forEach((alvo) => (contagem[alvo]++));

  const maximo = Math.max(...Object.values(contagem));
  const maisVotados = Object.keys(contagem).filter((id) => contagem[id] === maximo);
  const empate = maisVotados.length > 1;
  const acertaram = !empate && maisVotados[0] === segredo.isadoraId;

  estado.resultado = {
    vencedor: acertaram ? "inocentes" : "isadora",
    empate,
    isadoraNome: nomeDe(segredo.isadoraId),
    palavra: segredo.palavra,
    dica: segredo.dica,
    contagem: estado.jogadores
      .map((j) => ({ nome: j.nome, votos: contagem[j.id] }))
      .sort((a, b) => b.votos - a.votos),
  };
  estado.fase = "resultado";
  broadcast();
}

function voltarLobby(msg) {
  if (!ehHost) return;
  estado.fase = "lobby";
  estado.ordem = [];
  estado.vez = 0;
  estado.rodada = 1;
  estado.votaram = [];
  estado.resultado = null;
  segredo = null;
  votos = {};
  meuPapel = null;
  papelRevelado = false;
  broadcast();
  if (msg) {
    broadcastMsg({ t: "aviso", msg });
    aviso(msg);
  }
}

/* ---------- telas do jogo ---------- */
function renderizar() {
  const c = $("#conteudo-jogo");
  const telas = { lobby: htmlLobby, papel: htmlPapel, rodada: htmlRodada, votacao: htmlVotacao, resultado: htmlResultado };
  c.innerHTML = (telas[estado.fase] || htmlLobby)();
}

function htmlLobby() {
  const lista = estado.jogadores
    .map((j) => `<li><span>${esc(j.nome)}${j.id === meuId ? " (você)" : ""}</span>${j.id === "host" ? '<span class="selo">anfitrião</span>' : ""}</li>`)
    .join("");
  const botao = ehHost
    ? `<button class="btn" data-acao="iniciar" ${estado.jogadores.length < MIN_JOGADORES ? "disabled" : ""}>Começar jogo</button>
       <p class="espera">Mínimo de ${MIN_JOGADORES} jogadores</p>`
    : `<p class="espera">Esperando o anfitrião começar o jogo...</p>`;
  return `
    <div class="caixa">
      <p class="dica-texto">Código da sala</p>
      <div class="codigo-sala">${esc(estado.codigo || "")}</div>
      <p class="dica-texto">Passe esse código para a galera entrar</p>
    </div>
    <div class="caixa">
      <h2>Jogadores (${estado.jogadores.length})</h2>
      <ul class="lista">${lista}</ul>
      ${botao}
    </div>
    <button class="btn link" data-acao="sair">Sair da sala</button>`;
}

function htmlCartaPapel() {
  if (!meuPapel) return "";
  const eIsadora = meuPapel.papel === "isadora";
  const verso = eIsadora
    ? `<div class="verso isadora">
         <img src="${FOTO}" alt="Isadora" onerror="this.style.display='none'">
         <div class="faixa">
           <div class="papel-titulo vermelho">VOCÊ É A ISADORA!</div>
           <div class="info-dica">Sua dica:<strong>${esc(meuPapel.dica)}</strong></div>
           <div class="toque-esconder">Toque para esconder</div>
         </div>
       </div>`
    : `<div class="verso">
         <div class="nome-grande">${esc(meuNome)}</div>
         <div class="papel-titulo" style="margin-top:8px">Você NÃO é a Isadora</div>
         <div class="info-dica">A palavra é:<strong>${esc(meuPapel.palavra)}</strong></div>
         <div class="toque-esconder">Toque para esconder</div>
       </div>`;
  return `
    <div class="carta ${papelRevelado ? "revelada" : ""}" data-acao="ver-papel">
      <div class="frente">
        <div class="interrogacao">?</div>
        <p>Toque para ver seu papel</p>
        <p class="toque-esconder">Cuidado para ninguém olhar!</p>
      </div>
      ${verso}
    </div>`;
}

function htmlPapel() {
  const botao = ehHost
    ? `<button class="btn" data-acao="comecar-rodada">Todo mundo viu, começar!</button>`
    : `<p class="espera">Depois de ver, esconda a tela e espere o anfitrião começar.</p>`;
  return `${htmlCartaPapel()}${botao}`;
}

function htmlMiniPapel() {
  if (!meuPapel) return "";
  if (!papelRevelado) return `<div class="mini-papel" data-acao="ver-papel">Toque para rever seu papel</div>`;
  const texto = meuPapel.papel === "isadora"
    ? `Você é a <b>ISADORA</b> · dica: <b>${esc(meuPapel.dica)}</b>`
    : `${esc(meuNome)}, você <b>não</b> é a Isadora · palavra: <b>${esc(meuPapel.palavra)}</b>`;
  return `<div class="mini-papel" data-acao="ver-papel">${texto}<br><small>(toque para esconder)</small></div>`;
}

function htmlRodada() {
  const acabou = estado.vez >= estado.ordem.length;
  const lista = estado.ordem
    .map((id, i) => {
      const cls = i === estado.vez ? "atual" : i < estado.vez ? "feito" : "";
      return `<li class="${cls}"><span>${i + 1}. ${esc(nomeDe(id))}${id === meuId ? " (você)" : ""}</span></li>`;
    })
    .join("");

  let topo;
  let botoes = "";
  if (!acabou) {
    const idAtual = estado.ordem[estado.vez];
    topo = `<div class="vez-grande"><small>Rodada ${estado.rodada}</small><div class="nome">${esc(nomeDe(idAtual))}</div>
            <p>${idAtual === meuId ? "É a sua vez! Fale uma palavra (sem dar na cara)." : "está falando sua palavra..."}</p></div>`;
    if (ehHost) botoes = `<button class="btn" data-acao="proximo">${estado.vez + 1 < estado.ordem.length ? "Próximo jogador" : "Terminar rodada"}</button>`;
  } else {
    topo = `<div class="vez-grande"><small>Rodada ${estado.rodada}</small><div class="nome">Todos falaram!</div><p>Hora de decidir quem é a Isadora.</p></div>`;
    botoes = ehHost
      ? `<button class="btn" data-acao="ir-votacao">Ir para a votação</button>
         <button class="btn secundario" data-acao="mais-rodada">Mais uma rodada</button>`
      : `<p class="espera">O anfitrião vai escolher: mais uma rodada ou votação.</p>`;
  }

  return `
    <div class="caixa">${topo}<ul class="lista">${lista}</ul>${botoes}</div>
    ${htmlMiniPapel()}`;
}

function htmlVotacao() {
  const jaVotei = estado.votaram.includes(meuId);
  const progresso = `${estado.votaram.length}/${estado.jogadores.length} já votaram`;
  let corpo;
  if (jaVotei) {
    corpo = `<p class="espera">Voto enviado! Aguardando os outros...</p>`;
  } else {
    corpo = estado.jogadores
      .filter((j) => j.id !== meuId)
      .map((j) => `<button class="voto-btn" data-acao="votar" data-id="${esc(j.id)}"><span>${esc(j.nome)}</span><span>🗳️</span></button>`)
      .join("");
  }
  return `
    <div class="caixa">
      <h2>Quem é a Isadora?</h2>
      <p class="dica-texto">Escolha uma pessoa. Se a mais votada for a Isadora, os inocentes ganham!</p>
      ${corpo}
      <p class="espera">${progresso}</p>
    </div>
    ${htmlMiniPapel()}`;
}

function htmlResultado() {
  const r = estado.resultado;
  if (!r) return "";
  const inocentesGanharam = r.vencedor === "inocentes";
  const euSouIsadora = meuPapel && meuPapel.papel === "isadora";
  const euGanhei = inocentesGanharam ? !euSouIsadora : euSouIsadora;
  const titulo = inocentesGanharam ? "Acharam a Isadora!<br>Inocentes ganharam!" : r.empate ? "Empate!<br>A Isadora ganhou!" : "Errou!<br>A Isadora ganhou!";
  const linhas = r.contagem.map((c) => `<div class="linha"><span>${esc(c.nome)}</span><span>${c.votos} voto${c.votos === 1 ? "" : "s"}</span></div>`).join("");
  const botao = ehHost
    ? `<button class="btn" data-acao="jogar-de-novo">Jogar de novo</button>`
    : `<p class="espera">Esperando o anfitrião começar outra partida...</p>`;
  return `
    <div class="caixa">
      <div class="resultado-titulo ${euGanhei ? "ganhou" : "perdeu"}">${titulo}</div>
      <p class="dica-texto">${euGanhei ? "Você ganhou! 🎉" : "Você perdeu dessa vez."}</p>
      <img class="foto-reveal" src="${FOTO}" alt="Isadora" onerror="this.style.display='none'">
      <p style="text-align:center">A Isadora era <b>${esc(r.isadoraNome)}</b></p>
      <p class="dica-texto">Palavra: <b>${esc(r.palavra)}</b> · Dica da Isadora: <b>${esc(r.dica)}</b></p>
    </div>
    <div class="caixa"><h2>Votos</h2>${linhas}${botao}</div>`;
}

/* ---------- cliques ---------- */
document.addEventListener("click", (e) => {
  const el = e.target.closest("[data-acao]");
  if (!el) return;
  const acao = el.dataset.acao;

  switch (acao) {
    case "ir-criar": mostrarTela("tela-criar"); break;
    case "ir-entrar": mostrarTela("tela-entrar"); break;
    case "voltar-inicio": mostrarTela("tela-inicio"); break;
    case "criar": criarSala(); break;
    case "entrar": entrarSala(); break;
    case "iniciar": iniciar(); break;
    case "comecar-rodada": comecarRodada(); break;
    case "proximo": proximo(); break;
    case "mais-rodada": maisRodada(); break;
    case "ir-votacao": irVotacao(); break;
    case "votar": votar(el.dataset.id); break;
    case "jogar-de-novo": voltarLobby(); break;
    case "sair": sairParaInicio(); break;
    case "ver-papel": papelRevelado = !papelRevelado; renderizar(); break;
  }
});

// Só números no campo do código
$("#codigo-entrar").addEventListener("input", (e) => {
  e.target.value = e.target.value.replace(/\D/g, "").slice(0, 4);
});

// Enter nos campos
$("#nome-criar").addEventListener("keydown", (e) => { if (e.key === "Enter") criarSala(); });
$("#nome-entrar").addEventListener("keydown", (e) => { if (e.key === "Enter") entrarSala(); });

</script>
</body>
</html>
